<html>
    <head>
        <title>
            Java Code Function
        </title>
        <script>
            function MyFunction(){
            document.getElementById("demo").innerHTML = "Hello World";}
        </script>
    </head>
    <body>
        <p id="demo"></p>
        <button type="button" onclick="MyFunction()">Click Here</button>
    </body>
</html>
