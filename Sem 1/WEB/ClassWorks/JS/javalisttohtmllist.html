<body id="d">
    <script>
        const fruits = ["Melon","Apple","Orange"];
        let len = fruits.length;
        let txt = "<ul>";
        for (let i = 0 ; i < len; i++) {
            txt = txt + "<li>" + fruits[i] + "</li>";

        }
        txt = txt + "</ul>";
        document.getElementById("d").innerHTML = txt;
    </script>
</body>
