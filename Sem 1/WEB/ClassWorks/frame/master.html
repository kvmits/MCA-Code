<!-- Master Frame Of which there are 2 frames top and bottom y1,y2-->
<!-- and in the y2 frame there is 3 frames x1,x2,x3 diagonally-->
    
<html>
    <head>
        <title>Frames</title>
    </head>
    <frameset rows="35%,65%" noresize="noresize" frameborder="0" border="0" framespacing="0">
        <frame src="y1.html" name="topFrame">
            <frameset cols="33%,33%,33%" noresize="noresize" frameborder="0" border="0" framespacing="0">
                <frame src="f1.html" name="leftFrame">
                <frame src="f2.html" name="middleFrame">
                <frame src="f3.html" name="rightFrame">
        </frameset>
    </frameset>
</html>
    
</html>
