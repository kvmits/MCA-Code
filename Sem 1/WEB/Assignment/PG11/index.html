<!-- 11.Create an HTML registration form and validate the form using JavaScript code. -->
<html>
<head>
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form id="registrationForm">
        <label>Name: <input type="text" id="name" required></label><br><br>
        <label>Email: <input type="email" id="email" required></label><br><br>
        <label>Phone Number: <input type="tel" id="phone" pattern="[0-9]{10}" required></label><br><br>
        <button type="submit">Register</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const phone = document.getElementById("phone").value;
            const message = document.getElementById("message");

            if (!/^\d{10}$/.test(phone)) {
                message.textContent = "Phone number must be exactly 10 digits.";
            } else {
                message.textContent = "Registration successful!";
            }
        });
    </script>
</body>
</html>
