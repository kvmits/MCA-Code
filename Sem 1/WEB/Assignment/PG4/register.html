<!DOCTYPE html>
<html>
    <head>
        <title>MCA Registration - MITS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="registration-body">
        <main class="page-content registration-page">
            <h1>MCA Registration</h1>
            <p>Complete the form to register your interest in the MCA programme.</p>

            <form class="simple-form" action="#" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                </select>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="qualification">Highest Qualification</label>
                <input type="text" id="qualification" name="qualification" required>

                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4" required></textarea>

                <button type="submit" class="loginbutton">Register for MCA</button>
            </form>
        </main>
    </body>
</html>
