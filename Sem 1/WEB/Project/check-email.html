<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="Confirm your email to finish creating your Campify account.">
    <title>Check your email — Campify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="confirmation-screen">
      <section class="confirmation-card" aria-labelledby="confirmation-title">
        <a class="brand confirmation-brand" href="login.html" aria-label="Campify sign in">
          <span class="brand-mark" aria-hidden="true">c</span>
          <span>campify<span class="brand-dot">.</span></span>
        </a>
        <div class="confirmation-icon" aria-hidden="true">✉</div>
        <div class="eyebrow">ONE LAST STEP</div>
        <h1 id="confirmation-title">Check your inbox.</h1>
        <p id="confirmation-message">We sent a confirmation link to your college email. Open it to verify your address and finish creating your account.</p>
        <p class="confirmation-help">If it is not there, check your spam folder. Confirmation links expire, so use the newest email.</p>
        <a class="button button-dark confirmation-button" href="login.html">Back to sign in</a>
      </section>
    </main>
    <script>
      const message = new URLSearchParams(window.location.search).get("message");
      if (message) document.querySelector("#confirmation-message").textContent = message;
    </script>
  </body>
</html>
